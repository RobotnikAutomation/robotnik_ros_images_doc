---
name: "ros2-generate-debs"
services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        base_image: robotnik/ros
        ros_distro: humble
    volumes:
      - source: ./output
        target: /data/output
        type: bind
    command: tar xvf /data/debs.tar.gz -C /data/output
